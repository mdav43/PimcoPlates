name: Build & deploy to Cloudflare

on:
  push:
    branches: [demo-bank]
  pull_request:
  workflow_dispatch:
  # Re-pull live API specs nightly (scheduled runs use the default branch's workflow).
  schedule:
    - cron: '17 2 * * *'
  # API pipelines notify the portal after deploying a new spec.
  repository_dispatch:
    types: [api-changed]

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build (sync specs → generate API docs → site)
        run: npm run build
        env:
          # Credentials referenced as ${VAR} in apis/sources.json
          SPEC_FETCH_TOKEN: ${{ secrets.SPEC_FETCH_TOKEN }}
      - run: npx tsc
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/demo-bank' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
